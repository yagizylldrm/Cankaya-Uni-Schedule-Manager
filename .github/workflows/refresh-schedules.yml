name: Refresh offered courses

on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python refresh_schedules.py
      - name: Open a reviewable data PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- api/cankaya_courses.json; then
            echo "No course changes"
            exit 0
          fi
          branch="data/refresh-schedules-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- api/cankaya_courses.json
          git commit -m "data: refresh offered course schedules"
          git push -u origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "data: refresh offered course schedules" \
            --body "Automated refresh from the university offered-course listing. Please review course, section, and instructor changes before merging."
