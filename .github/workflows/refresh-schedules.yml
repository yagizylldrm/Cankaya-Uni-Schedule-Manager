name: Refresh catalog and schedules

on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python refresh_schedules.py
      - run: python collect_prerequisites.py
        env:
          CANKAYA_EBS_TOKEN: ${{ secrets.CANKAYA_EBS_TOKEN }}
          OGBS_API_TOKEN: ${{ secrets.OGBS_API_TOKEN }}
      - run: python refresh_course_catalog.py
      - run: python refresh_instructors.py
      - name: Open a reviewable data PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- api/*.json; then
            echo "No catalog or schedule changes"
            exit 0
          fi
          branch="data/refresh-schedules-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- api/*.json
          git commit -m "data: comprehensive weekly catalog and schedule refresh"
          git push -u origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "data: comprehensive weekly catalog and schedule refresh" \
            --body "Automated weekly refresh of the university course catalog, prerequisites, schedules, and instructors. Please review the generated data changes before merging."
